# Packaging and tooling configuration for Model Doctor.
#
# This file used to declare no build system, on the grounds that the project is
# an application run from its source tree. That stopped being the whole story
# when Ramanujan needed to run the analysis inside its own process: two projects
# cannot both own a top-level `utils` package, so this code moved under
# `model_doctor/` and became installable.
#
# What installs is the engine. The dashboard, the HTTP services and the MCP
# server are extras, because a host embedding the analysis should not be made
# to carry Streamlit in order to get it.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "model-doctor"
# Tracks storage.SCHEMA_VERSION. The database is the contract between this
# package, its own dashboard, and any host embedding it; the version a host
# pins should say which schema it is going to meet.
version = "0.15.0"
description = "Why a vision model's predictions fail, measured from a run."
readme = "README.md"
requires-python = ">=3.11"

# The engine's runtime needs, and only those. requirements.txt stays the way a
# developer sets up a full checkout, extras included.
dependencies = [
    "ultralytics>=8.4.0",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pycocotools>=2.0.7",
    "opencv-python>=4.9.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "scikit-learn>=1.4.0",
    "open_clip_torch>=2.24.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30.0", "plotly>=5.18.0"]
service = ["fastapi>=0.110.0", "uvicorn>=0.27.0"]
mcp = ["mcp>=1.2.0"]
dev = ["pytest>=8.0.0", "httpx>=0.26.0", "ruff>=0.6.0"]

[tool.setuptools.packages.find]
# The package only. `tests`, `scripts`, `deploy` and `web` are part of the
# checkout, not of the distribution.
include = ["model_doctor*"]

[tool.ruff]
# 88 rather than PEP 8's original 79. PEP 8 explicitly permits teams to raise
# this, and 88 (the Black/Ruff default) is the modern norm: it keeps two files
# side by side on a laptop while letting a descriptive name and a type hint
# share one line without contortions.
line-length = 88
target-version = "py311"
exclude = [".venv", "results", "build", "dist"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors      - PEP 8 layout
    "W",    # pycodestyle warnings
    "F",    # pyflakes                - unused imports, undefined names
    "I",    # isort                   - deterministic import order
    "N",    # pep8-naming             - naming conventions
    "UP",   # pyupgrade               - modern syntax for the target version
    "B",    # flake8-bugbear          - likely bugs, not just style
    "SIM",  # flake8-simplify         - needless complexity
    "PTH",  # flake8-use-pathlib      - pathlib over os.path
    "ARG",  # flake8-unused-arguments
    "D",    # pydocstyle              - docstrings are a project requirement
]

# Rules deliberately disabled, each with a reason. A silently-ignored rule is
# technical debt; a documented one is a decision.
ignore = [
    "D203",  # Conflicts with D211. We use D211 (no blank line before class).
    "D213",  # Conflicts with D212. We use D212 (summary on first line).
]

[tool.ruff.lint.pydocstyle]
# Google style: "Args:/Returns:/Raises:" sections, which read well for humans
# and are understood by every major documentation generator.
convention = "google"

[tool.ruff.lint.per-file-ignores]
# Test functions document themselves through their names and a one-line
# docstring; full Args/Returns sections on a test add noise, not clarity.
"tests/*" = ["D103"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Quiet by default; the suite is fast enough that per-test output is noise.
addopts = "-q"
